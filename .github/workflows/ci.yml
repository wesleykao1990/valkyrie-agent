name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: deterministic verification (Node 22 / PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Normal verification also strips inherited opt-in settings. Keep the CI
      # posture explicit: no provider, connector, writer, or external action.
      ATOMIC_FIXTURE_PILOT_ENABLED: "false"
      ATOMIC_FIXTURE_MODEL_PILOT_ENABLED: "false"
      DIRECT_CODEX_MODEL_PILOT_ENABLED: "false"
      DIRECT_CLAUDE_MODEL_PILOT_ENABLED: "false"
      LINEAR_CONNECTOR_MODE: disabled
      GITHUB_CONNECTOR_MODE: disabled
    steps:
      - name: Check out exact revision
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          package-manager-cache: false

      - name: Expose PostgreSQL 16 tools
        shell: bash
        run: |
          set -euo pipefail
          pg_config --version | grep -E '^PostgreSQL 16\.'
          printf '%s\n' "$(pg_config --bindir)" >> "$GITHUB_PATH"

      - name: Verify tracked-file manifest
        shell: bash
        run: |
          set -euo pipefail
          LC_ALL=C sort -c FILE_MANIFEST.txt
          diff -u FILE_MANIFEST.txt <(git ls-files | LC_ALL=C sort)

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Strict TypeScript
        run: npm run typecheck

      - name: Deterministic general tests
        run: npm test

      - name: PostgreSQL 16 contracts
        run: npm run test:postgres

      - name: Atomic package verification
        run: npm run verify:atomic

      - name: HTTP smoke
        run: npm run smoke:http

      - name: MCP smoke
        run: npm run smoke:mcp

  secret-scan:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history without credentials
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
